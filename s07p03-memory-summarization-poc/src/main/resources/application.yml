spring:
  main:
    web-application-type: none
    banner-mode: off
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:claude}
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:demo-placeholder-not-a-real-key}
        vertex-ai: false
logging:
  level:
    root: WARN
    org.springframework.ai: WARN
    com.pocs.memorysummarization: INFO
