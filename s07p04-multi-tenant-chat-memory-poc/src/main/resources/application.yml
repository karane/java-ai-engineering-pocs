app:
  provider: ${APP_PROVIDER:claude}
spring:
  main:
    web-application-type: none
    banner-mode: off
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:claude}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:demo-placeholder-not-a-real-key}
        vertex-ai: false

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
gemini:
  api-key: ${GEMINI_API_KEY:demo-placeholder-not-a-real-key}
