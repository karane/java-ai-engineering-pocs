spring:
  main:
    web-application-type: none
    banner-mode: off
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        model: claude-haiku-4-5-20251001
        temperature: 0.3
        max-tokens: 512
    google:
      genai:
        # Only the embedding model is used from this starter - chat goes through Anthropic above.
        api-key: ${GEMINI_API_KEY:demo-placeholder-not-a-real-key}
        vertex-ai: false
        embedding:
          api-key: ${GEMINI_API_KEY:demo-placeholder-not-a-real-key}
          vertex-ai: false
          project-id: ${GOOGLE_CLOUD_PROJECT:demo-placeholder-project}
          location: us-central1
          text:
            options:
              model: gemini-embedding-001

logging:
  level:
    root: WARN
    org.springframework.ai: WARN
