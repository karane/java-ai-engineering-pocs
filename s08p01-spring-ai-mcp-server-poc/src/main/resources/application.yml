spring:
  main:
    banner-mode: off
  ai:
    mcp:
      server:
        name: s08p01-mcp-server
        version: 0.1.0
        type: SYNC
        # webmvc transport (default for this starter) serves MCP over HTTP:
        #   SSE endpoint:          GET  /sse
        #   streamable-HTTP:       POST /mcp
        # To run this same server over stdio instead (the shape Claude Desktop / s08p02 expect when
        # spawning it as a subprocess), run with -Dspring.ai.mcp.server.stdio=true -Dspring.main.web-application-type=none
        # (see application-stdio.yml) rather than switching the starter dependency.
        stdio: false

server:
  port: 8081

logging:
  level:
    root: WARN
    org.springframework.ai: WARN
