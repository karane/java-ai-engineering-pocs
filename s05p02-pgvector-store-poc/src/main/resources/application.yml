spring:
  main:
    web-application-type: none
    banner-mode: off
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:demo-placeholder-not-a-real-key}
        vertex-ai: false
        chat:
          options:
            model: gemini-3.5-flash-lite
        embedding:
          api-key: ${GEMINI_API_KEY:demo-placeholder-not-a-real-key}
          vertex-ai: false
          project-id: ${GOOGLE_CLOUD_PROJECT:demo-placeholder-project}
          location: us-central1
          text:
            options:
              model: gemini-embedding-001
  # No real Postgres is assumed to be running for the plain `mvn test`/app-boot path -
  # DataSource/JdbcTemplate (and therefore PgVectorStoreAutoConfiguration, which needs a
  # JdbcTemplate bean) are excluded so the app and contextLoads test still start with zero
  # services. PgVectorDemoRunner builds its own DataSource/JdbcTemplate/PgVectorStore by
  # hand instead, only when PGVECTOR_JDBC_URL is explicitly set - see README for running
  # against a real Postgres+pgvector instance.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

logging:
  level:
    root: WARN
    org.springframework.ai: WARN
