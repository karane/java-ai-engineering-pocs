spring:
  main:
    web-application-type: none
    banner-mode: off
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        model: claude-haiku-4-5-20251001
        temperature: 0.7
        max-tokens: 512

app:
  # Deliberately small so the demo runner's LONG_RETRIEVED_CONTEXT trips the
  # truncation path without needing an unreasonably long "retrieved" passage.
  max-prompt-tokens: 220

logging:
  level:
    root: WARN
    org.springframework.ai: WARN
